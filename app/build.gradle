apply plugin: 'com.android.application'

android {
    compileSdk = 37
    defaultConfig {
        applicationId = "externius.rdmg"
        minSdkVersion 30
        targetSdk = 37
        versionCode = 58
        versionName = '1.1.3.2'
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        proguardFiles = ['proguard-rules.pro']
        multiDexEnabled = true
    }
    buildTypes {
        release {
            optimization {
                enable = true
            }
        }
    }
    productFlavors {
    }
    tasks.withType(Test).configureEach {
        testLogging {
            events = ['passed', 'skipped', 'failed', 'standardOut', 'standardError']
            showStandardStreams = true
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    packagingOptions {
        resources {
            excludes += ['README.txt']
        }
    }
    namespace = 'externius.rdmg'
    compileSdkMinor 2
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.annotation:annotation:1.11.0'
    androidTestImplementation 'androidx.annotation:annotation:1.11.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.4.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.android.material:material:1.14.0'
    testImplementation 'junit:junit:4.13.2'
    implementation 'org.hamcrest:hamcrest-library:3.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'androidx.loader:loader:1.2.0'
}

configurations.implementation {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
